plugins {
    id 'application'
    id 'java'
}

import java.nio.charset.StandardCharsets
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.time.LocalDateTime
import java.time.format.DateTimeFormatter

group = 'studio.pixelpoint'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.0'
    implementation 'org.telegram:telegrambots-longpolling:10.3.0'
    implementation 'org.telegram:telegrambots-client:10.3.0'
    implementation 'org.flywaydb:flyway-core:13.6.0'
    implementation 'org.flywaydb:flyway-database-nc-sqlite:13.6.0'
    implementation 'org.xerial:sqlite-jdbc:3.53.4.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'studio.pixelpoint.magicpet.MagicPetApplication'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

def runCaptured = { List<String> command, File directory ->
    def process = new ProcessBuilder(command)
            .directory(directory)
            .redirectErrorStream(true)
            .start()
    def output = process.inputStream.getText('UTF-8')
    def exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("Команда завершилась с ошибкой:\n${output.trim()}")
    }
    output.trim()
}

tasks.register('prepareLesson') {
    group = 'magic pet'
    description = 'Создаёт отдельную папку для пробного урока и открывает её в VS Code.'
    dependsOn tasks.named('classes')

    doLast {
        File source = projectDir.canonicalFile
        if (runCaptured(['git', 'branch', '--show-current'], source) != 'main') {
            throw new GradleException('Откройте исходный проект на ветке main и повторите подготовку.')
        }
        if (!runCaptured(['git', 'status', '--porcelain', '--untracked-files=normal'], source).isEmpty()) {
            throw new GradleException('В исходной папке есть несохранённые изменения. Позовите технического специалиста.')
        }

        String timestamp = providers.gradleProperty('lessonTimestamp')
                .getOrElse(LocalDateTime.now().format(DateTimeFormatter.ofPattern('yyyyMMdd-HHmmss')))
        if (!(timestamp ==~ /[0-9]{8}-[0-9]{6}(-[0-9]+)?/)) {
            throw new GradleException('Не удалось создать номер занятия.')
        }

        String branchName = "lesson/session-${timestamp}"
        File parent = providers.gradleProperty('lessonWorktreeRoot')
                .map { new File(it) }
                .getOrElse(new File(source.parentFile, 'magic-pet-lessons'))
                .canonicalFile
        File target = new File(parent, "session-${timestamp}").canonicalFile
        parent.mkdirs()
        if (target.exists()) {
            throw new GradleException("Папка занятия уже существует: ${target}")
        }

        boolean worktreeCreated = false
        try {
            runCaptured(['git', 'show-ref', '--verify', '--quiet', 'refs/heads/main'], source)
            runCaptured(['git', 'worktree', 'add', '-b', branchName, target.absolutePath, 'main'], source)
            worktreeCreated = true

            Files.copy(new File(target, '.env.example').toPath(), new File(target, '.env').toPath(),
                    StandardCopyOption.REPLACE_EXISTING)
            Files.createDirectories(new File(target, 'data').toPath())

            File secretFile = new File(source, '.env.lesson-secrets')
            File envFile = new File(target, '.env')
            Map<String, String> schoolAi = [:]
            if (secretFile.isFile()) {
                secretFile.readLines('UTF-8').each { line ->
                    int separator = line.indexOf('=')
                    if (separator > 0) {
                        String key = line.substring(0, separator)
                        if (key in ['LLM_API_URL', 'LLM_API_KEY', 'LLM_MODEL'] && separator < line.length() - 1) {
                            schoolAi[key] = line
                        }
                    }
                }
            }
            List<String> envLines = envFile.readLines('UTF-8').collect { line ->
                int separator = line.indexOf('=')
                String key = separator > 0 ? line.substring(0, separator) : ''
                schoolAi.containsKey(key) ? schoolAi[key] : line
            }
            envFile.setText(envLines.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')

            String aiStatus = schoolAi.containsKey('LLM_API_URL')
                    ? 'подключён автоматически'
                    : 'не настроен — бот использует готовый резервный план'
            File lessonReadme = new File(target, 'lesson/README.lesson.md')
            String readme = lessonReadme.getText('UTF-8').replace('{{AI_STATUS}}', aiStatus)
            new File(target, 'README.md').setText(readme, 'UTF-8')
            Files.delete(lessonReadme.toPath())

            runCaptured(['git', 'add', '-u'], target)
            runCaptured(['git', '-c', 'user.name=Pixel Point Lesson',
                         '-c', 'user.email=lesson@pixelpoint.local',
                         'commit', '-m', 'Подготовить папку пробного урока'], target)

            println ''
            println '✅ Папка для урока готова'
            println "ПАПКА_УРОКА=${target.absolutePath}"
            println 'В ней доступны все три темы и все 12 независимых заданий.'

            if (!providers.gradleProperty('lessonNoOpen').map { it == 'true' }.getOrElse(false)) {
                String executable = System.getProperty('os.name').toLowerCase().contains('windows') ? 'code.cmd' : 'code'
                try {
                    new ProcessBuilder(executable, '--new-window', target.absolutePath,
                            new File(target, 'README.md').absolutePath).start()
                    println 'Visual Studio Code открыт автоматически.'
                } catch (IOException ignored) {
                    println 'VS Code не открылся автоматически. Откройте указанную выше папку вручную.'
                }
            }
        } catch (Exception failure) {
            if (worktreeCreated) {
                try { runCaptured(['git', 'worktree', 'remove', '--force', target.absolutePath], source) } catch (Exception ignored) {}
                try { runCaptured(['git', 'branch', '-D', branchName], source) } catch (Exception ignored) {}
            }
            throw failure
        }
    }
}

tasks.register('checkTask') {
    group = 'magic pet'
    description = 'Проверяет одно учебное задание по коду S1–S4, I1–I4 или B1–B4.'

    doLast {
        Map<String, String> testsByCode = [
                S1: 'studyWrongPet', S2: 'studySavesCustomName',
                S3: 'studyShowsPet', S4: 'studyRenamesPet',
                I1: 'sportLevelsAtOneHundred', I2: 'sportShowsCurrentLevelImage',
                I3: 'sportConfirmsDeletion', I4: 'sportShowsLevelProgress',
                B1: 'blogShowsActiveTasks', B2: 'blogDeletesWithoutXp',
                B3: 'blogShowsHint', B4: 'blogShowsFullPlan'
        ]
        String code = providers.gradleProperty('task').getOrElse('').toUpperCase()
        if (!testsByCode.containsKey(code)) {
            throw new GradleException('Введите код задания: S1–S4, I1–I4 или B1–B4.')
        }

        String wrapper = System.getProperty('os.name').toLowerCase().contains('windows')
                ? new File(projectDir, 'gradlew.bat').absolutePath
                : new File(projectDir, 'gradlew').absolutePath
        def process = new ProcessBuilder(wrapper, 'test',
                '--tests', "*LessonRouteContractTest.${testsByCode[code]}", '--quiet')
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
        process.inputStream.getText('UTF-8')
        int exitCode = process.waitFor()
        if (exitCode == 0) {
            println "✅ Задание ${code} выполнено"
        } else {
            throw new GradleException("Пока не получилось выполнить ${code}. Проверьте подсказку в карточке GitHub и последние изменения.")
        }
    }
}
